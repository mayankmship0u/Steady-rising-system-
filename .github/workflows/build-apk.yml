name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Prepare Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "android/ directory not found in repo. Initializing Capacitor Android platform..."
            npx cap add android
          else
            echo "android/ directory detected. Syncing web assets and plugins..."
            npx cap sync android
          fi
          # Ensure custom launcher icons are populated
          if [ -f "scripts/generate-icons.js" ]; then
            node scripts/generate-icons.js || true
          fi

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Artifact
        run: |
          echo "Checking generated APK files:"
          ls -la android/app/build/outputs/apk/debug/
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk not found!"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: steady-shadow-level-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
